<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GN-Math</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
  <header>
    <div class="header-content">
      <div class="logo">GN-Math</div>
      <div class="search-container">
        <input type="text" id="searchBar" class="input" placeholder="Search zones..." oninput="filterZones()">
        <select id="sortOptions" class="input" onchange="sortZones()">
          <option value="name">Name</option>
          <option value="id">ID (Date)</option>
          <option value="popular">Popular</option>
        </select>
        <select id="filterOptions" class="input" onchange="filterZones2()">
          <option value="none">(SELECT TAG)</option>
        </select>
      </div>
      <div class="control-buttons">
        <button id="refresh" class="control-button" title="Refresh all zones" onclick="listZones()">
          <img src="refresh-icon.png" alt="Refresh">
        </button>
        <button id="settings" class="control-button" title="Settings">
          <img src="setting.png" alt="Settings">
        </button>
      </div>
    </div>
  </header>

  <main>
    <details id="featuredZonesWrapper" open>
      <summary class="summary-title">Featured Zones</summary>
      <div id="featuredZones" class="zone-container grid"></div>
    </details>

    <hr>

    <details id="allZonesWrapper" open>
      <summary class="summary-title">All Zones</summary>
      <div id="container" class="grid">Loading...</div>
    </details>
  </main>

  <div id="zoneViewer">
    <div class="zone-header">
      <div class="zone-title">
        <h2 id="zoneName">Zone</h2>
        <span id="zoneId" hidden></span>
        <a id="zoneAuthor" href="#" target="_blank">by Author</a>
      </div>
      <div class="zone-controls">
        <button class="btn" onclick="fullscreenZone()">Fullscreen</button>
        <button class="btn" onclick="aboutBlank()">Open in New Tab</button>
        <button class="btn" onclick="downloadZone()">Download</button>
        <button class="btn" onclick="closeZone()">Close</button>
      </div>
    </div>
    <iframe id="zoneFrame"></iframe>
  </div>

  <div id="popupOverlay">
    <div class="popup">
      <div class="popup-header">
        <h3 id="popupTitle">Title</h3>
        <button id="popupClose" onclick="closePopup()">×</button>
      </div>
      <div id="popupBody">Content will be here</div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="#" onclick="loadDMCA(); return false;">DMCA</a>
      <a href="#" onclick="showContact(); return false;">Contact</a>
      <a href="#" onclick="loadPrivacy(); return false;">Privacy Policy</a>
      <a href="javascript:saveData()">Export Data</a>
      <a href="#" onclick="document.getElementById('importData').click(); return false;">Import Data</a>
      <input type="file" id="importData" hidden onchange="loadData(event)">
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
